    <ellipse cx="1215" cy="112" rx="98" ry="10"/>
  </g>

  <!-- birds -->
  <g fill="none" stroke="#69857f" stroke-width="1.7" stroke-linecap="round" opacity=".6">
    <path d="M984 135c6-5 11-5 16 0 5-5 10-5 16 0"/>
    <path d="M1032 111c4-4 8-4 12 0 4-4 8-4 12 0"/>
    <path d="M926 158c3-3 7-3 10 0 3-3 7-3 10 0"/>
