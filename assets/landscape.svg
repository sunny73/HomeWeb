    <path d="M1539 480c-3-70 9-118 37-158 26-37 67-65 112-80" stroke-width="19"/>
    <path d="M1539 480c-3-70 9-118 37-158 26-37 67-65 112-80" stroke-width="8" stroke="#8d6a5c" opacity=".55"/>
    <path d="M1557 367c-34-32-79-47-132-49" stroke-width="11"/>
    <path d="M1538 399c-60-25-111-18-159 4" stroke-width="9"/>
    <path d="M1506 333c-37-29-79-42-124-42" stroke-width="7"/>
    <path d="M1455 310c-35-26-76-35-119-30" stroke-width="5"/>
    <path d="M1391 393c-27-17-54-20-82-11" stroke-width="6"/>
    <path d="M1333 380c-26-6-49-1-68 13" stroke-width="4"/>
