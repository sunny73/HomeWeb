    <path d="M1161 345v-24" stroke="#6f6552" stroke-width="2"/>
    <path d="M1134 327c0-16 10-28 24-28s24 12 24 28c0 13-11 20-24 20s-24-7-24-20Z" fill="#789b67" opacity=".92"/>
