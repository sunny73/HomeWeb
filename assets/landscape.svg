    </g>
  </g>

  <!-- warm light and grain -->
  <rect width="1600" height="480" fill="#fff8e7" opacity=".05"/>
  <rect width="1600" height="480" filter="url(#grain)" opacity=".24" style="mix-blend-mode:soft-light"/>
  <rect x="960" y="0" width="640" height="480" fill="#fff5dd" opacity=".03"/>
</svg>
