    <path d="M0 352 111 311 223 342 335 303 449 349 568 311 681 350 804 310 923 346 1044 307 1174 345 1290 311 1411 347 1524 314 1600 337 1600 397 0 397Z" fill="#84a9af" opacity=".28"/>
  </g>

  <!-- atmospheric haze -->
  <rect x="0" y="280" width="1600" height="95" fill="url(#haze)" opacity=".85"/>

  <!-- middle hills -->
  <path d="M0 351C91 327 170 329 260 341c104 14 184 6 278-8 88-13 150-4 234 7 116 15 178 7 268-5 116-15 206-4 312 6 92 9 171 1 248-9v148H0Z" fill="url(#nearHill)" opacity=".88"/>
  <path d="M0 383c132-28 226-19 342 3 112 21 198 13 306-8 116-22 214-20 326 1 120 23 226 8 338-6 94-12 190-8 288 11v96H0Z" fill="#b3cf95" opacity=".9"/>

