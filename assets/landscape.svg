      <path d="M736 252 751 241 767 253 757 250 751 258 744 252Z"/>
      <path d="M1078 266 1094 255 1111 266 1100 263 1093 273 1087 265Z"/>
      <path d="M1253 271 1270 260 1288 271 1275 268 1268 279 1261 270Z"/>
