    <g stroke="#668e58" stroke-width="1.2" fill="none" opacity=".75">
      <path d="M60 480c2-20 4-35 12-49M88 480c-2-17 1-32 9-42M126 480c4-15 8-28 17-37M1012 480c-1-23 5-42 15-56M1054 480c-3-17 3-33 12-46M1130 480c1-22 8-37 19-51M1208 480c-2-17 4-32 13-44"/>
      <path d="M152 480c5-15 12-26 23-34M960 480c-2-17 0-31 7-43"/>
