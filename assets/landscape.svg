    <use href="#blossomCluster" transform="translate(1520 186) scale(1.45)"/>
    <use href="#blossomCluster" transform="translate(1450 160) scale(1.2)"/>
    <use href="#blossomCluster" transform="translate(1375 211) scale(1.25)"/>
    <use href="#blossomCluster" transform="translate(1305 250) scale(1.1)"/>
    <use href="#blossomCluster" transform="translate(1260 300) scale(.95)"/>
    <use href="#blossomCluster" transform="translate(1430 272) scale(1.05)"/>
    <use href="#blossomCluster" transform="translate(1354 320) scale(.92)"/>
    <use href="#blossomCluster" transform="translate(1517 316) scale(1.08)"/>
    <use href="#blossomCluster" transform="translate(1584 130) scale(1.5)"/>
    <use href="#blossomCluster" transform="translate(1460 94) scale(1.15)"/>
    <use href="#blossomCluster" transform="translate(1380 132) scale(.9)"/>
    <use href="#blossomCluster" transform="translate(1553 244) scale(.95)"/>
    <use href="#blossomCluster" transform="translate(1215 342) scale(.78)"/>
  </g>
  <g opacity=".8">
    <use href="#blossom" transform="translate(1502 138) scale(.7)"/>
    <use href="#blossom" transform="translate(1412 365) scale(.65)"/>
    <use href="#blossom" transform="translate(1536 406) scale(.6)"/>
  </g>

  <!-- falling petals -->
  <g fill="#f5c7d0" opacity=".86">
    <path d="M1420 236c6-3 10 1 8 7-2 5-8 7-11 2-2-3 0-7 3-9Z"/>
    <path d="M1491 333c5-2 9 2 7 7-1 4-7 6-9 2-2-3 0-6 2-9Z" opacity=".75"/>
    <path d="M1362 265c5-2 8 1 7 6-1 4-6 6-9 2-2-3 0-6 2-8Z" opacity=".65"/>
    <path d="M1292 321c4-2 7 1 6 5-1 3-5 5-7 2-2-2 0-5 1-7Z" opacity=".7"/>
    <path d="M1455 182c4-2 7 1 6 5-1 3-5 5-7 2-2-2 0-5 1-7Z" opacity=".65"/>
    <path d="M1547 359c4-2 7 1 6 5-1 3-5 5-7 2-2-2 0-5 1-7Z" opacity=".75"/>
    <circle cx="1311" cy="287" r="2.1" opacity=".65"/>
    <circle cx="1395" cy="211" r="1.8" opacity=".7"/>
    <circle cx="1488" cy="298" r="1.7" opacity=".6"/>
