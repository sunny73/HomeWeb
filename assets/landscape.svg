  <path d="M70 425c128-18 256-10 383 13 74 13 142 18 215 17v25H70Z" fill="#d2dc9a" opacity=".48"/>
  <g fill="none" stroke="#799f63" stroke-width="1.3" opacity=".32">
    <path d="M0 420c174-18 302 4 438 23 129 18 238 15 357-5"/>
    <path d="M0 448c119-10 217 0 316 12 91 11 167 11 250-3"/>
    <path d="M1080 412c112-7 218 2 331 16 65 8 127 9 189 7"/>
  </g>

  <!-- winding path -->
  <path d="M741 480c64-30 137-48 190-72 45-20 78-39 111-63 24-17 58-23 96-24l43 2c-46 12-84 28-112 48-46 34-80 61-117 109Z" fill="url(#pathFill)" opacity=".9"/>
  <path d="M775 480c61-28 131-46 181-68 45-20 77-38 110-61 27-19 61-25 96-26" fill="none" stroke="#fdf5dc" stroke-width="2" opacity=".7"/>
  <path d="M951 480c26-39 59-68 100-94 31-20 66-34 106-47" fill="none" stroke="#d9c291" stroke-width="1.4" opacity=".55"/>

