    <path d="M1216 344c-2-19 0-33 6-45 3-5 7-5 9 0 4 12 4 28 1 45Z" opacity=".88"/>
  </g>
  <g stroke="#f4d987" stroke-width="1.2" opacity=".8">
    <path d="M1227 345v-8M1231 345v-11M1235 345v-7M1353 344v-9M1357 344v-12M1361 344v-8"/>
  </g>

