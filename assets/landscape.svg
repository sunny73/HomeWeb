<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" preserveAspectRatio="xMidYMid slice" role="img" aria-label="春日山谷与樱花小屋的插画">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#aee0f0"/>
      <stop offset=".42" stop-color="#d8f0f6"/>
      <stop offset=".72" stop-color="#f3f6e7"/>
      <stop offset="1" stop-color="#f5f0da"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fffdf1" stop-opacity=".96"/>
      <stop offset=".35" stop-color="#fff9dc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="farMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82acc7"/>
      <stop offset=".5" stop-color="#a1c5d6"/>
      <stop offset="1" stop-color="#cfe4e3"/>
    </linearGradient>
    <linearGradient id="midMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f9a97"/>
      <stop offset="1" stop-color="#aecdb5"/>
    </linearGradient>
    <linearGradient id="nearHill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b0cf98"/>
      <stop offset=".55" stop-color="#84ad70"/>
      <stop offset="1" stop-color="#63935e"/>
    </linearGradient>
    <linearGradient id="meadow" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#bed8a0"/>
      <stop offset=".48" stop-color="#96be77"/>
      <stop offset="1" stop-color="#719a5f"/>
    </linearGradient>
    <linearGradient id="goldField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d2d496"/>
      <stop offset="1" stop-color="#aebd83"/>
    </linearGradient>
    <linearGradient id="pathFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2e5c1"/>
      <stop offset="1" stop-color="#e9d4a6"/>
    </linearGradient>
    <radialGradient id="blossomFill" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#fff0ee"/>
      <stop offset=".5" stop-color="#f8d3d9"/>
      <stop offset="1" stop-color="#efb8c4"/>
    </radialGradient>
    <radialGradient id="houseGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff5ce" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff5ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf4" stop-opacity="0"/>
      <stop offset=".55" stop-color="#fffdf4" stop-opacity=".72"/>
      <stop offset="1" stop-color="#fffdf4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="softSmall" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="17" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".12"/>
      </feComponentTransfer>
    </filter>
    <g id="blossom">
      <ellipse cx="0" cy="-6.4" rx="5.2" ry="6.8" fill="url(#blossomFill)"/>
      <ellipse cx="-6.2" cy="-1.8" rx="4.9" ry="6.1" fill="url(#blossomFill)" transform="rotate(-70 -6.2 -1.8)"/>
      <ellipse cx="6.2" cy="-1.8" rx="4.9" ry="6.1" fill="url(#blossomFill)" transform="rotate(70 6.2 -1.8)"/>
      <ellipse cx="-3.9" cy="5.4" rx="4.4" ry="5.5" fill="url(#blossomFill)" transform="rotate(38 -3.9 5.4)"/>
      <ellipse cx="3.9" cy="5.4" rx="4.4" ry="5.5" fill="url(#blossomFill)" transform="rotate(-38 3.9 5.4)"/>
      <circle cx="0" cy="0" r="2" fill="#e5a0a9"/>
      <circle cx="-.5" cy="-.5" r=".8" fill="#f9dfd4"/>
    </g>
    <g id="blossomCluster">
      <use href="#blossom" transform="translate(-8 -2) scale(1.05)" opacity=".96"/>
      <use href="#blossom" transform="translate(9 -7) scale(.9)" opacity=".88"/>
      <use href="#blossom" transform="translate(5 8) scale(1.12)" opacity=".95"/>
      <use href="#blossom" transform="translate(-11 10) scale(.82)" opacity=".8"/>
      <use href="#blossom" transform="translate(17 3) scale(.72)" opacity=".72"/>
    </g>
  </defs>

  <rect width="1600" height="480" fill="url(#sky)"/>
  <ellipse cx="1120" cy="126" rx="290" ry="180" fill="url(#sunGlow)"/>

  <!-- soft clouds -->
  <g fill="#fffdf8" opacity=".62" filter="url(#soft)">
    <ellipse cx="660" cy="118" rx="155" ry="34"/>
    <ellipse cx="760" cy="101" rx="108" ry="46"/>
    <ellipse cx="855" cy="122" rx="126" ry="28"/>
    <ellipse cx="1105" cy="76" rx="125" ry="24"/>
    <ellipse cx="1210" cy="94" rx="90" ry="34"/>
    <ellipse cx="1305" cy="80" rx="105" ry="23"/>
    <ellipse cx="420" cy="88" rx="92" ry="18"/>
    <ellipse cx="1495" cy="126" rx="120" ry="27"/>
  </g>
  <g fill="#cbe3e8" opacity=".35" filter="url(#softSmall)">
